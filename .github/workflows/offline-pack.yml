name: Offline pack

# Rebuilds the Glik app's offline packs (offline-pack.json for Poland,
# offline-pack-en.json for the English version) from Open Food Facts every
# week. See README.md.
on:
  schedule:
    - cron: '17 4 * * 1' # Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write # to request the Pages build below

concurrency:
  group: offline-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # A pack whose fetch fails, or that ends with fewer than 300 products,
      # is left untouched and the step fails; the other pack is still written
      # and committed below (`always()`).
      - name: Build the offline packs
        run: python3 tools/build_offline_pack.py

      - name: Commit and push if changed
        id: push
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- offline-pack.json offline-pack-en.json)" ]; then
            echo "offline packs unchanged, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-pack.json offline-pack-en.json
          git commit -m "Paczka offline: odświeżenie $(date -u +%Y-%m-%d)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # "Commits pushed by a GitHub Actions workflow that uses the GITHUB_TOKEN
      # do not trigger a GitHub Pages build" (GitHub docs), so the new file
      # would never go live without this.
      - name: Request a GitHub Pages build
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
